[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-default"
version = "0.1.0"
description = "Predict credit card default next month (UCI 350)"
requires-python = ">=3.10"
dependencies = [
    "ucimlrepo==0.0.7",
    "pandas==2.3.1",
    "numpy==2.3.1",
    "scikit-learn==1.7.0",
    "matplotlib==3.10.3",
    "joblib==1.5.1",
    "PyYAML==6.0.2",
    "xlrd==2.0.2",
]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[project.scripts]
credit-default = "credit_default.cli:main"