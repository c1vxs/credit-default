random_state: 42
test_size: 0.2
target: default
paths:
  raw_data: data/raw/credit_default.xls
  model: models/model.joblib

# decision rule: catch at least 60 % of defaulters, then keep the best precision
min_recall: 0.60
threshold: 0.21 # the value printed in notebook Part 6

# final model, chosen in notebook Part 5-6 (replace with the printed lines)
model:
  name: knn
  params: {n_neighbors: 51}

# hyperparameter grids for GridSearchCV (notebook Part 5)
grids:
  logistic_regression: {clf__C: [0.01, 0.1, 1, 10]}
  knn: {clf__n_neighbors: [15, 25, 51]}
  linear_svm: {clf__C: [0.01, 0.1, 1]}
